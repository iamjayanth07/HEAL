<!-- templates/home.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAL - Your Health Companion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0fbff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .hero {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 60px 20px;
        }
        .hero-text {
            flex: 1;
            padding: 20px;
        }
        .hero-text h1 {
            font-size: 3rem;
            font-weight: 600;
            color: #0d6efd;
        }
        .hero-text p {
            font-size: 1.2rem;
            color: #555;
            margin-top: 15px;
        }
        .cta-btn {
            margin-top: 30px;
            font-size: 1.1rem;
            padding: 12px 28px;
            border-radius: 30px;
        }
        .hero-image {
            flex: 1;
            padding: 20px;
            text-align: center;
        }
        .hero-image img {
            max-width: 280px;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin: 12px auto;
            display: block;
        }
        footer {
            background-color: #007bff;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="container hero">
        <div class="hero-text">
            <h1>Welcome to HEAL</h1>
            <p>Your trusted AI-powered health assistant. Input your blood test values and receive immediate insights with dietary recommendations designed to keep you healthy and informed.</p>
            <a href="/input" class="btn btn-primary cta-btn">Start Your Health Check</a>
        </div>
        <div class="hero-image">
            <img src="{{ url_for('static', filename='img/image1.png') }}" alt="Health Illustration">

        </div>
    </div>

    <footer>
        <p>&copy; 2024 HEAL. Your wellness, our mission.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
