<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HEAL - Health Report Input</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center">Enter Your Health Report Values</h2>
    <form method="post" action="/analyze" class="row g-3">
        {% for field in ['hemoglobin','sugar','cholesterol','iron','vitamin_d','platelets','wbc_count','rbc_count','creatinine','uric_acid'] %}
        <div class="col-md-4">
            <label for="{{ field }}" class="form-label">{{ field.replace('_', ' ').title() }}</label>
            <input type="number" class="form-control" step="any" name="{{ field }}" id="{{ field }}"
                   value="{{ previous[field]|default('') }}" required>
        </div>
        {% endfor %}
        <div class="col-12 text-center">
            <button type="submit" class="btn btn-primary">Analyze</button>
        </div>
    </form>
</div>
</body>
</html>
